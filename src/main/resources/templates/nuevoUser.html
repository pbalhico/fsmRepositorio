<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - Find Stock Manager</title>

    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Italiana&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/formulario.css}">

</head>
<body>
<div th:replace="~{fragmentos/header :: headerFragment}"></div>

<main class="main-content-form-wrapper">
    <div class="container form-container"><h1 class="form-title text-center">Registro de nuevo usuario</h1>
        <form th:action="@{/admin/usuarios}" th:object="${usuarioDto}" method="post" enctype="multipart/form-data"
              class="user-form">

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
            </div>

            <div class="mb-3">
                <label for="apellido" class="form-label">Apellido</label>
                <input type="text" class="form-control" id="apellido" th:field="*{apellido}" required>
            </div>

            <div class="mb-3">
                <label for="rol" class="form-label">Rol</label>
                <select class="form-select" id="rol"
                        th:field="*{rolId}" required>
                    <option value="">Seleccione un rol</option>
                    <option th:each="rolOption : ${listaRoles}"
                            th:value="${rolOption.id}"
                            th:text="${rolOption.tipoRol}">Manager
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label for="almacen" class="form-label">Almacén</label>
                <select class="form-select" id="almacen"
                        th:field="*{almacenId}" required>
                    <option value="">Seleccione un almacén</option>
                    <option th:each="almacenOption : ${listaAlmacenes}"
                            th:value="${almacenOption.id}"
                            th:text="${almacenOption.nombreAlmacen}">Almacén Central
                    </option>
                </select>
            </div>


            <div class="mb-3">
                <label for="nif" class="form-label">NIF</label>
                <input type="text" class="form-control" id="nif" th:field="*{nif}" required pattern="\d{8}[A-Za-z]">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" th:field="*{email}" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" th:field="*{password}" required>
            </div>

            <div class="mb-3">
                <label for="fotografiaUsuario" class="form-label">Fotografía</label>
                <input type="file" class="form-control" id="fotografiaUsuario" th:field="*{fotografiaUsuarioFile}">
            </div>


            <button type="submit" class="btn btn-primary register-button">Registrar</button>

        </form>
    </div>
</main>

<footer class="footer-bar">
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
