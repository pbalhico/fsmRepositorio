<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle ?: 'Listado de Pedidos - Find Stock Manager'}">Listado de Pedidos - Find Stock
        Manager</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Italiana&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/listaTienda.css}">
</head>
<body>
<div th:replace="~{fragmentos/header :: headerFragment}"></div>

<main class="main-content container-fluid">
    <div class="container">
        <div class="row align-items-center mb-3">
            <div class="col">
                <h1 class="section-title" th:text="${pageTitle}">Listado de Pedidos</h1>
            </div>
        </div>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="filter-area p-3 mb-3">
            <form method="get" th:action="@{/pedidos/lista}">
                <input type="hidden" name="destinoTipo" th:value="${selectedDestinoTipo}"/>

                <div class="row align-items-center">
                    <div class="col-md-6">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="filterPendientes" name="estado"
                                   value="Pendiente" th:checked="${#lists.contains(selectedEstados, 'Pendiente')}">
                            <label class="form-check-label" for="filterPendientes">Pendientes</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="filterCompletos" name="estado"
                                   value="Completado" th:checked="${#lists.contains(selectedEstados, 'Completado')}">
                            <label class="form-check-label" for="filterCompletos">Completados</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="filterEnTramite" name="estado"
                                   value="En tramite" th:checked="${#lists.contains(selectedEstados, 'En tramite')}">
                            <label class="form-check-label" for="filterEnTramite">En tramite</label>
                        </div>
                    </div>
                    <div class="col-md-6 d-flex justify-content-md-end align-items-center">
                        <label for="filterByDate" class="me-2 mb-0">Filtrar por fecha:</label>
                        <input type="date" class="form-control form-control-sm filter-input" id="filterByDate"
                               name="fechaSolicitud" th:value="${selectedFechaSolicitud}">
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col text-center">
                        <button type="submit" class="btn btn-primary btn-sm me-2">Aplicar Filtros</button>
                        <a th:href="@{/pedidos/lista}" class="btn btn-secondary btn-sm">Reset Filtros</a>
                    </div>
                </div>
            </form>
        </div>

        <h2 class="list-title" th:text="${pageTitle}">listado de los pedidos</h2>

        <div class="order-table-container">
            <div class="background-logo"></div>

            <table class="table table-hover order-table">
                <thead>
                <tr>
                    <th scope="col">ID Pedido</th>
                    <th scope="col">Estado</th>
                    <th scope="col">Fecha Solicitud</th>
                    <th scope="col">Fecha Recepción</th>
                    <th scope="col"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="pedidoEntity : ${pedidos}">
                    <td th:text="${pedidoEntity.id}"></td>
                    <td th:text="${pedidoEntity.estado?.descripcionEstado}"></td>
                    <td th:text="${pedidoEntity.fechaSolicitud}"></td>
                    <td th:text="${pedidoEntity.fechaRecepcion ?: 'N/A'}"></td>
                    <td>
                        <a th:href="@{/pedidos/{id}(id=${pedidoEntity.id}, returnUrl=${request.requestURI + (#strings.isEmpty(request.queryString) ? '' : '?' + request.queryString)})}"
                           class="btn btn-sm btn-secondary">Acceder</a>
                    </td>
                </tr>
                <tr th:if="${pedidos.empty}">
                    <td colspan="5" class="text-center">No se encontraron pedidos.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer class="footer-bar">
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
