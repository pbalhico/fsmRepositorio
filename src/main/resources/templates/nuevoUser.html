<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario - Find Stock Manager</title>

    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Italiana&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/formulario.css}">

</head>
<body>
<div th:replace="~{fragmentos/header :: headerFragment}"></div>

<main class="main-content-form-wrapper">
    <div class="container form-container">
        <h1 class="form-title text-center">Registro de nuevo usuario</h1>
        <form th:action="@{/admin/usuarios}" th:object="${usuarioDto}" method="post" enctype="multipart/form-data"
              class="user-form">

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
            </div>

            <div class="mb-3">
                <label for="apellido" class="form-label">Apellido</label>
                <input type="text" class="form-control" id="apellido" th:field="*{apellido}" required>
            </div>

            <div class="mb-3">
                <label for="rol" class="form-label">Rol</label>
                <select class="form-select" id="rol"
                        th:field="*{rolId}" required>
                    <option value="">Seleccione un rol</option>
                    <option th:each="rolOption : ${listaRoles}"
                            th:value="${rolOption.id}"
                            th:text="${rolOption.tipoRol}">Manager
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label for="almacen" class="form-label">Almacén</label>
                <select class="form-select" id="almacen"
                        th:field="*{almacenId}" required>
                    <option value="">Seleccione un almacén</option>
                    <option th:each="almacenOption : ${listaAlmacenes}"
                            th:value="${almacenOption.id}"
                            th:text="${almacenOption.nombreAlmacen}">Almacén Central
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label for="nif" class="form-label">NIF</label>
                <input type="text" class="form-control" id="nif" th:field="*{nif}" required pattern="\d{8}[A-Za-z]">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" th:field="*{email}" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" th:field="*{password}" required>
            </div>

            <div class="mb-3">
                <label for="fotografiaUsuario" class="form-label">Fotografía</label>
                <input type="file" class="form-control" id="fotografiaUsuario" th:field="*{fotografiaUsuarioFile}">
            </div>

            <button type="submit" class="btn btn-primary register-button">Registrar</button>

        </form>
    </div>
</main>

<footer class="footer-bar">
</footer>

<div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="successModalLabel">Operación Exitosa</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <span th:text="${mensajeExito}"></span>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    // Verificar si el atributo 'usuarioAgregadoExito' está presente y es true
    const usuarioAgregadoExito = /*[[${usuarioAgregadoExito}]]*/ false;
    const successMessage = /*[[${mensajeExito}]]*/ 'Usuario agregado correctamente a la plantilla';

    if (usuarioAgregadoExito) {
        // Obtener la instancia del modal de Bootstrap
        const successModalElement = document.getElementById('successModal');
        const successModal = new bootstrap.Modal(successModalElement);

        // Asegurarse de que el mensaje se muestre correctamente en el modal
        successModalElement.querySelector('.modal-body span').textContent = successMessage;

        // Mostrar el modal
        successModal.show();

        // Escuchar el evento cuando el modal se oculta (se cierra)
        successModalElement.addEventListener('hidden.bs.modal', function () {
            // Redirigir a /index cuando el modal se cierre
            window.location.href = '/index';
        });
    }
    /*]]>*/
</script>
</body>
</html>
