<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos Tienda - Find Stock Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Italiana&display=swap" rel="stylesheet">

    <!--    <link rel="stylesheet" th:href="@{/css/listaTienda.css}"> AVERIGUAR PORQUE NO LO PILLA DE ESTA FORMA-->
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" href="../static/css/listaTienda.css">
</head>
<body>

<header class="top-bar">
    <div class="container-fluid d-flex align-items-center justify-content-between">
        <div class="header-title">FIND STOCK MANAGER</div>

        <div class="right-icons d-flex align-items-center">
            <button class="btn btn-outline-dark menu-toggle-btn" type="button" data-bs-toggle="collapse"
                    data-bs-target="#menuHamburguesa"
                    aria-controls="menuHamburguesa" aria-expanded="false" aria-label="Toggle navigation">
                <i class="fas fa-bars"></i>
            </button>

            <li sec:authorize="isAuthenticated()" class="nav-item dropdown user-dropdown-item">
                <a class="nav-link dropdown-toggle user-icon-link" href="#" role="button" data-bs-toggle="dropdown"
                   aria-expanded="false">
                    <i class="fas fa-user"></i> <span class="d-none d-md-inline" th:text="${#authentication.name}">Usuario</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li sec:authorize="hasAuthority('manager')">
                        <a class="dropdown-item" href="nuevoUser.html" id="lnkAddUser">
                            <i class="fas fa-user-plus"></i> Añadir Usuario
                        </a>
                    </li>
                    <li sec:authorize="hasAuthority('manager')">
                        <hr class="dropdown-divider">
                    </li>
                    <li>
                        <a class="dropdown-item" th:href="@{/logout}" id="lnkSalir">
                            <i class="fas fa-sign-out-alt"></i> Salir
                        </a>
                    </li>
                </ul>
            </li>
        </div>

    </div>

    <div class="collapse" id="menuHamburguesa">
        <div class="menu-list text-start">
            <a th:href="@{/pedidos/lista}">Listado Pedidos Tienda</a>
            <a href="#">Listado Pedidos Restock</a>
            <a href="#">Listado de Secciones</a>
            <a href="#">Listado de Categorías</a>
            <a href="#">Artículos</a>
        </div>
    </div>
</header>

<main class="main-content container-fluid">
    <div class="container">
        <div class="row align-items-center mb-3">
            <div class="col">
                <h1 class="section-title">Pedidos tienda</h1>
            </div>
        </div>

        <div class="filter-area p-3 mb-3">
            <form method="get" th:action="@{/pedidos/lista}">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="filterPendientes" name="estado"
                                   value="Pendiente" th:checked="${#lists.contains(selectedEstados, 'Pendiente')}">
                            <label class="form-check-label" for="filterPendientes">pendientes</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="filterArchivados" name="estado"
                                   value="Archivado" th:checked="${#lists.contains(selectedEstados, 'Archivado')}">
                            <label class="form-check-label" for="filterArchivados">archivados</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="filterCompletos" name="estado"
                                   value="Completado" th:checked="${#lists.contains(selectedEstados, 'Completado')}">
                            <label class="form-check-label" for="filterCompletos">completos</label>
                        </div>
                    </div>
                    <div class="col-md-6 d-flex justify-content-md-end align-items-center">
                        <label for="filterByDate" class="me-2 mb-0">Filtrar por fecha:</label>
                        <input type="date" class="form-control form-control-sm filter-input" id="filterByDate"
                               name="fechaSolicitud" th:value="${selectedFechaSolicitud}">
                    </div>
                </div>
                <div class="row mt-2">
                    <div class="col text-center">
                        <button type="submit" class="btn btn-primary btn-sm">Aplicar Filtros</button>
                    </div>
                </div>
            </form>
        </div>

        <h2 class="list-title">listado de los pedidos</h2>

        <div class="order-table-container">
            <div class="background-logo"></div>

            <table class="table table-hover order-table">
                <thead>
                <tr>
                    <th scope="col">pedido</th>
                    <th scope="col">estado</th>
                    <th scope="col">fecha</th>
                    <th scope="col"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="pedido : ${pedidos}">
                    <td th:text="${pedido.id}"></td>
                    <td th:text="${pedido.estado.descripcionEstado}"></td>
                    <td th:text="${pedido.fechaSolicitud}"></td>
                    <td>
                        <a th:href="@{/pedidos/{id}(id=${pedido.id})}" class="btn btn-sm btn-secondary">acceder</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer class="footer-bar">
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
