<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Detalle del Artículo: ' + ${articuloEntity?.nombreArticulo} + ' - Find Stock Manager'">Detalle del
        Artículo - Find Stock Manager</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Italiana&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/listaTienda.css}">
    <link rel="stylesheet" th:href="@{/css/articulo.css}">
</head>
<body>

<div th:replace="~{fragmentos/header :: headerFragment}"></div>

<main class="main-content container-fluid">
    <div class="container article-detail-container">
        <div class="row mb-4">
            <div class="col-12 text-center">
                <h1 class="article-page-title" th:text="'Artículo: ' + ${articuloEntity?.id}">Artículo</h1>
            </div>
        </div>

        <div class="article-card-wrapper p-3 mb-3">
            <div class="row">
                <div class="col-md-5 text-center mb-3 mb-md-0 article-image-col">
                    <img th:if="${articuloEntity?.fotografiaArt != null and articuloEntity?.fotografiaArt != ''}"
                         th:src="@{'/images/' + ${articuloEntity.fotografiaArt}}"
                         alt="Fotografía del Artículo" class="img-fluid rounded article-photo">
                    <div th:unless="${articuloEntity?.fotografiaArt != null and articuloEntity?.fotografiaArt != ''}"
                         class="article-photo-placeholder rounded">
                        <span>Sin Foto</span>
                    </div>
                </div>

                <div class="col-md-7 article-details-col">
                    <h2 class="article-name" th:text="${articuloEntity?.nombreArticulo}">NOMBRE</h2>

                    <div class="article-details-grid mb-4">
                        <div class="detail-item"><strong>ID:</strong> <span
                                th:text="${articuloEntity?.id}">ID Articulo</span></div>
                        <div class="detail-item"><strong>Categoría:</strong> <span
                                th:text="${articuloEntity?.seccionEntity?.categoriaSeccion}">Sección del Artículo</span>
                        </div>
                        <div class="detail-item"><strong>Color:</strong> <span
                                th:text="${articuloEntity?.color}">Color</span></div>
                        <th:block th:if="${articuloEntity?.talla != null and articuloEntity?.talla != ''}">
                            <div class="detail-item"><strong>Talla:</strong> <span th:text="${articuloEntity?.talla}">Talla</span>
                            </div>
                        </th:block>
                        <div class="detail-item price-item"><strong>Precio:</strong> <span
                                th:text="${articuloEntity?.precio} + ' €'">Precio</span></div>
                        <th:block th:if="${articuloEntity?.stock != null}">
                            <div class="detail-item stock-item"><strong>Stock:</strong> <span
                                    th:text="${articuloEntity?.stock}">Stock</span></div>
                        </th:block>
                    </div>

                    <div class="action-buttons-area mt-4 text-center text-md-start">
                        <button class="btn btn-primary order-button">Pedir reposición</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center mt-4 back-button-area">
            <a th:href="@{/articulos/lista}" class="btn btn-secondary btn-lg return-button">Volver al Listado</a>
        </div>

    </div>
</main>

<footer class="footer-bar">
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
