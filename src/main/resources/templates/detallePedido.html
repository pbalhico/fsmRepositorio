<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Detalle del Pedido ' + ${pedidoEntity?.id} + ' - Find Stock Manager'">Detalle del Pedido - Find
        Stock
        Manager</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Italiana&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/listaTienda.css}">
    <link rel="stylesheet" th:href="@{/css/detallePedido.css}">
</head>
<body>
<div th:replace="~{fragmentos/header :: headerFragment}"></div>

<main class="main-content container-fluid">
    <div class="container">

        <div class="row align-items-center mb-3">
            <div class="col">
                <h1 class="section-title" th:text="'Pedido ' + ${pedidoEntity?.id}">Detalle del Pedido</h1>
            </div>
        </div>

        <div class="order-details-area p-3 mb-3">
            <p><strong>Estado:</strong> <span
                    th:text="${pedidoEntity?.estado?.descripcionEstado}">Estado del Pedido</span>
            </p>
            <p><strong>Fecha de Solicitud:</strong> <span
                    th:text="${pedidoEntity?.fechaSolicitud}">Fecha de Solicitud</span>
            </p>
        </div>


        <h2 class="list-title">listado de articulos</h2>

        <div class="articles-table-container order-table-container">
            <div class="background-logo"></div>

            <table class="table table-hover order-table">
                <thead>
                <tr>
                    <th scope="col">articuloEntity</th>
                    <th scope="col">unidades</th>
                    <th scope="col">importe</th>
                    <th scope="col">Acción</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${articulosPedido}" th:data-item-id="${item.id.articuloEntity}">
                    <td th:text="${item.articuloEntity?.nombreArticulo}">Nombre Articulo</td>
                    <td th:text="${item.cantidadPedidoArticulo}">Cantidad</td>
                    <td th:text="${item.importeTotal}">Importe</td>
                    <td>
                        <button class="btn btn-sm btn-success add-item-btn me-2"
                                th:data-item-id="${item.id.articuloEntity}">
                            Añadir
                        </button>
                        <input type="checkbox" class="form-check-input item-added-checkbox" disabled>
                    </td>
                </tr>
                <tr th:if="${articulosPedido == null or articulosPedido.empty}">
                    <td colspan="4" class="text-center">No se encontraron artículos para este pedidoEntity.</td>
                </tr>
                </tbody>
                <tfoot>
                <tr>
                    <td colspan="2" class="text-end"><strong>IMPORTE TOTAL PEDIDO:</strong></td>
                    <td th:text="${#aggregates.sum(articulosPedido.![importeTotal])}">XXX€</td>
                    <td></td>
                </tr>
                </tfoot>
            </table>
        </div>

        <div class="text-center mt-4">
            <button id="concluirPedidoBtn" class="btn btn-primary btn-lg" disabled>concluir pedidoEntity</button>
        </div>

    </div>
</main>

<footer class="footer-bar">
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Obtener todos los botones "Añadir"
        const addButtons = document.querySelectorAll('.add-item-btn');
        // Obtener el botón "concluir pedidoEntity"
        const concluirButton = document.getElementById('concluirPedidoBtn');
        // Conjunto para rastrear los IDs de los artículos que han sido añadidos
        const addedItems = new Set();

        // Deshabilitar el botón de concluir al cargar la página (ya está en el HTML, pero lo confirmamos)
        concluirButton.disabled = true;

        // Añadir un evento click a cada botón "Añadir"
        addButtons.forEach(button => {
            button.addEventListener('click', function () {
                // Obtener el ID del artículo desde el data-attribute del botón
                const itemId = this.dataset.itemId;
                // Obtener la fila (tr) que contiene este botón
                const row = this.closest('tr');
                // Obtener la casilla de verificación dentro de esta fila
                const checkbox = row.querySelector('.item-added-checkbox');


                // Si el artículo aún no ha sido añadido
                if (!addedItems.has(itemId)) {
                    // Marcar el artículo como añadido en nuestro conjunto
                    addedItems.add(itemId);

                    // Marcar la casilla de verificación
                    if (checkbox) {
                        checkbox.checked = true;
                    }

                    // Cambiar la apariencia del botón (opcional, pero recomendado)
                    this.textContent = 'Añadido'; // Cambia el texto del botón
                    this.classList.remove('btn-success'); // Quita la clase de éxito
                    this.classList.add('btn-secondary'); // Añade una clase secundaria (o deshabilitado visualmente)
                    this.disabled = true; // Deshabilita el botón para que no se pueda volver a pulsar


                    // Verificar si todos los artículos han sido añadidos
                    // El número total de artículos es la cantidad de botones "Añadir"
                    if (addedItems.size === addButtons.length) {
                        // Si todos los artículos han sido añadidos, habilitar el botón de concluir
                        concluirButton.disabled = false;
                    }
                }
            });
        });

        // Opcional: Puedes añadir un evento click al botón "concluir pedidoEntity"
        // para manejar la lógica de guardar el pedidoEntity como completado, etc.
        // concluirButton.addEventListener('click', function() {
        //     // Lógica para concluir el pedidoEntity
        //     alert('Pedido concluido!');
        //     // Aquí podrías enviar una petición AJAX al servidor para actualizar el estado del pedidoEntity
        // });
    });
</script>
</body>
</html>
