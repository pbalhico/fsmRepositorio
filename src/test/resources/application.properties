# src/test/resources/application.properties
# Configuración para la base de datos H2 en memoria para TESTS
# Importante: Esto crea una base de datos temporal en memoria para cada ejecución de test.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Configuración de JPA/Hibernate para tests
# 'create-drop' es adecuado para tests, ya que el esquema se crea y se destruye en cada ejecución
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Deshabilitar la inicialización automática de scripts SQL para tests.
spring.sql.init.mode=never
# ¡NUEVO! Anular explícitamente la ubicación de los scripts de datos para evitar que intente leer un data.sql vacío
spring.sql.init.data-locations=
spring.sql.init.schema-locations=
# Excluir BatchAutoConfiguration también para los tests, para evitar conflictos
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration
# Desactivar las tareas programadas durante los tests, para que no interfieran con la lógica de prueba
# Cambiado de -1 a un valor muy grande para evitar IllegalArgumentException
app.scheduling.generar-pedidos-tienda.fixed-rate=9999999999999
app.scheduling.reponer-stock.fixed-rate=9999999999999