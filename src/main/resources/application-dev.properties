# src/main/resources/application-dev.properties
# Propiedades específicas para el entorno de DESARROLLO
# Configuración para H2 en modo embebido (ideal para desarrollo local)
# La base de datos se guardará en un archivo llamado 'fsmdb.mv.db' en el directorio '~/db/' (Home del usuario)
spring.datasource.url=jdbc:h2:file:./db/fsmdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Configuración de JPA/Hibernate para gestionar el esquema en desarrollo
# 'update' intenta actualizar el esquema existente sin borrar datos.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Especificar explícitamente el dialecto de H2 (ayuda a Hibernate)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Habilitar la consola H2 para desarrollo
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Habilitar la inicialización de scripts SQL (DataLoader) al inicio de la aplicación
# Esto asegura que tu DataLoader se ejecute siempre en desarrollo.
spring.sql.init.mode=always
# Aunque el DataLoader se encarga, estas líneas pueden estar presentes si tienes data.sql/schema.sql para H2
# spring.sql.init.data-locations=classpath:data.sql
# spring.sql.init.schema-locations=classpath:schema.sql
# Configuración de Logging para desarrollo
logging.level.es.examplepb.findstockmanager=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# Configuración de las tareas programadas en desarrollo (activas)
# Intervalo para la tarea de pedidos a tienda (cada 2 minutos = 120000 ms)
app.scheduling.generar-pedidos-tienda.fixed-rate=120000
# Intervalo para la tarea de reposición de stock (cada 5 minutos = 300000 ms)
app.scheduling.reponer-stock.fixed-rate=300000
# IDs fijos y valores para las tareas automáticas en desarrollo
app.stock-config.minimo=100
# DESHABILITAR LA AUTO-CONFIGURACIÓN DE SPRING BATCH (si no la usas)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration
# Configuración de Flyway para H2 en desarrollo
# Esto es lo CRÍTICO para solucionar tu error.
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
