<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Añadir Nuevo Artículo - Find Stock Manager</title>

    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Italiana&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/formulario.css}">
</head>
<body>
<div th:replace="~{fragmentos/header :: headerFragment}"></div>

<main class="main-content-form-wrapper">
    <div class="container form-container">
        <h1 class="form-title text-center">Añadir Nuevo Artículo</h1>
        <form th:action="@{/articulos/nuevo}" th:object="${articuloDto}" method="post" enctype="multipart/form-data"
              class="user-form">

            <div class="mb-3">
                <label for="id" class="form-label">ID del Artículo</label>
                <input type="text" class="form-control" id="id" th:field="*{id}" required
                       th:classappend="${#fields.hasErrors('id') ? 'is-invalid' : ''}">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('id')}" th:errors="*{id}"></div>
            </div>

            <div class="mb-3">
                <label for="nombreArticulo" class="form-label">Nombre del Artículo</label>
                <input type="text" class="form-control" id="nombreArticulo" th:field="*{nombreArticulo}" required
                       th:classappend="${#fields.hasErrors('nombreArticulo') ? 'is-invalid' : ''}">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('nombreArticulo')}"
                     th:errors="*{nombreArticulo}"></div>
            </div>

            <div class="mb-3">
                <label for="seccion" class="form-label">Sección</label>
                <select class="form-select" id="seccion" th:field="*{seccionId}" required
                        th:classappend="${#fields.hasErrors('seccionId') ? 'is-invalid' : ''}">
                    <option value="">Seleccione una sección</option>
                    <option th:each="seccionOption : ${listaSecciones}"
                            th:value="${seccionOption.id}"
                            th:text="${seccionOption.categoriaSeccion}">
                    </option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('seccionId')}" th:errors="*{seccionId}"></div>
            </div>

            <div class="mb-3">
                <label for="color" class="form-label">Color</label>
                <input type="text" class="form-control" id="color" th:field="*{color}" required
                       th:classappend="${#fields.hasErrors('color') ? 'is-invalid' : ''}">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('color')}" th:errors="*{color}"></div>
            </div>

            <div class="mb-3">
                <label for="talla" class="form-label">Talla (ej. S, M, XL)</label>
                <input type="text" class="form-control" id="talla" th:field="*{talla}"
                       th:classappend="${#fields.hasErrors('talla') ? 'is-invalid' : ''}">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('talla')}" th:errors="*{talla}"></div>
            </div>

            <div class="mb-3">
                <label for="precio" class="form-label">Precio (€)</label>
                <input type="number" step="0.01" class="form-control" id="precio" th:field="*{precio}" required
                       th:classappend="${#fields.hasErrors('precio') ? 'is-invalid' : ''}">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
            </div>

            <div class="mb-3">
                <label for="stock" class="form-label">Stock Inicial</label>
                <input type="number" class="form-control" id="stock" th:field="*{stock}" required min="0"
                       th:classappend="${#fields.hasErrors('stock') ? 'is-invalid' : ''}">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
            </div>

            <div class="mb-3">
                <label for="fotografiaArtFile" class="form-label">Fotografía</label>
                <input type="file" class="form-control" id="fotografiaArtFile" th:field="*{fotografiaArtFile}">
            </div>

            <button type="submit" class="btn btn-primary register-button">Añadir Artículo</button>

        </form>
    </div>
</main>

<footer class="footer-bar">
</footer>

<div class="modal fade" id="articuloModal" tabindex="-1" aria-labelledby="articuloModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="articuloModalLabel"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <span id="modalMessage"></span>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    const articuloAgregadoExito = /*[[${articuloAgregadoExito}]]*/ null; // Será true/false/null
    const successMessage = /*[[${mensajeExito}]]*/ '';
    const errorMessage = /*[[${errorMessage}]]*/ '';

    const articuloModalElement = document.getElementById('articuloModal');
    const articuloModal = new bootstrap.Modal(articuloModalElement);
    const modalTitle = document.getElementById('articuloModalLabel');
    const modalMessage = document.getElementById('modalMessage');

    if (articuloAgregadoExito !== null) { // Si hay un resultado de la operación
        if (articuloAgregadoExito) {
            modalTitle.textContent = "Artículo Añadido con Éxito";
            modalMessage.textContent = successMessage;
            articuloModalElement.querySelector('.modal-header').classList.remove('bg-danger');
            articuloModalElement.querySelector('.modal-header').classList.add('bg-success');
        } else {
            modalTitle.textContent = "Error al Añadir Artículo";
            modalMessage.textContent = errorMessage;
            articuloModalElement.querySelector('.modal-header').classList.remove('bg-success');
            articuloModalElement.querySelector('.modal-header').classList.add('bg-danger');
        }

        articuloModal.show();

        // Escuchar el evento cuando el modal se oculta (se cierra)
        articuloModalElement.addEventListener('hidden.bs.modal', function () {
            // Puedes decidir si redirigir a alguna página, o simplemente recargar el formulario
            // Para "nuevoArticulo.html", redirigir al listado o recargar el formulario vacío es común.
            // window.location.href = '/articulos/lista'; // Redirigir al listado
            window.location.href = '/articulos/nuevo'; // Recargar el formulario vacío para añadir otro
        });
    }
    /*]]>*/
</script>
</body>
</html>
