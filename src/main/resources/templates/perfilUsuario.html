<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Perfil de ' + ${usuario?.nombre} + ' - Find Stock Manager'">Perfil de Usuario - Find Stock
        Manager</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Italiana&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/perfilUsuario.css}">
</head>
<body>

<div th:replace="~{fragmentos/header :: headerFragment}"></div>

<main class="main-content container-fluid">
    <div class="container user-profile-container">
        <div class="row mb-4">
            <div class="col-12 text-center">
                <h1 class="profile-page-title">Mi Perfil de Empleado</h1>
            </div>
        </div>

        <div class="profile-card-wrapper p-4 mb-3">
            <div class="row">
                <div class="col-md-4 text-center profile-avatar-col mb-4 mb-md-0">
                    <img th:if="${usuario?.fotografiaUsuario != null and usuario?.fotografiaUsuario != ''}"
                         th:src="@{'/' + ${usuario.fotografiaUsuario}}"
                         alt="Fotografía del Usuario" class="img-fluid rounded-circle profile-avatar">
                    <i th:unless="${usuario?.fotografiaUsuario != null and usuario?.fotografiaUsuario != ''}"
                       class="fas fa-user-circle fa-8x profile-avatar-icon"></i>

                    <h3 class="profile-name mt-3" th:text="${usuario?.nombre}">Nombre del Usuario</h3>
                    <p class="profile-email" th:text="${usuario?.email}">email@example.com</p>
                </div>
                <div class="col-md-8 profile-details-col">
                    <h4 class="details-title">Información del Empleado</h4>
                    <div class="profile-details-grid">
                        <div class="detail-item"><strong>ID:</strong> <span th:text="${usuario?.id}"></span></div>
                        <div class="detail-item"><strong>Nombre Completo:</strong> <span
                                th:text="${usuario?.nombre} + ' ' + ${usuario?.apellido}"></span></div>
                        <div class="detail-item"><strong>Email:</strong> <span th:text="${usuario?.email}"></span></div>
                        <div class="detail-item"><strong>NIF:</strong> <span th:text="${usuario?.nif}"></span></div>

                        <div class="detail-item"><strong>Rol:</strong> <span th:text="${usuario?.rolEntity?.tipoRol}"
                                                                             class="badge bg-primary"></span></div>

                        <th:block th:if="${usuario?.almacen != null}">
                            <div class="detail-item"><strong>Almacén Asignado:</strong> <span
                                    th:text="${usuario?.almacen?.nombreAlmacen}"></span></div>
                        </th:block>
                    </div>

                    <div class="profile-actions mt-4 text-center text-md-start">
                    </div>
                </div>
            </div>
        </div>

        <div class="text-center mt-5">
            <a th:href="@{/index}" class="btn btn-secondary btn-lg return-button">Volver al Inicio</a>
        </div>
    </div>
</main>

<footer class="footer-bar">
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
