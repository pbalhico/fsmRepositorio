# src/main/resources/application-prod.properties
# Propiedades específicas para el entorno de PRODUCCIÓN
# Configuración de la base de datos de producción (ej. PostgreSQL)
# ¡IMPORTANTE! Estas propiedades deben ser sobreescritas por variables de entorno en el servidor
# Esto es por seguridad y flexibilidad.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/your_prod_db}
spring.datasource.username=${JDBC_DATABASE_USERNAME:your_prod_user}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:your_prod_password}
spring.datasource.driver-class-name=org.postgresql.Driver
# Configuración de JPA/Hibernate para producción
# 'validate' es la opción más segura en producción: Hibernate solo valida que el esquema de la BD
# coincide con tus entidades, pero no hace cambios automáticos.
# Los cambios de esquema se gestionan con herramientas de migración (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false # Deshabilitar en producción
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect # O el dialecto de tu BD
# Deshabilitar la inicialización automática de scripts SQL (data.sql, schema.sql) en producción.
# Las migraciones de base de datos (Flyway/Liquibase) se encargarán de esto.
spring.sql.init.mode=never
# Configuración de Logging para producción (menos verboso)
logging.level.root=INFO
logging.level.es.examplepb.findstockmanager=INFO # O WARN, ERROR
logging.file.name=/var/log/findstockmanager/app.log # Ruta común para logs en servidores
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
# Configuración de las tareas programadas en producción
# Ajusta estos valores según la frecuencia deseada en producción
app.scheduling.generar-pedidos-tienda.fixed-rate=3600000 # Ejemplo: cada hora (3600000 ms)
app.scheduling.reponer-stock.fixed-rate=86400000 # Ejemplo: cada 24 horas (86400000 ms)
# IDs fijos y valores para las tareas automáticas en producción
app.stock-config.minimo=100
upload.path.images=./uploads/images
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
