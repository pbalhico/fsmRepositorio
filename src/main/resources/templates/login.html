<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- Fuente Italiana -->
    <link href="https://fonts.googleapis.com/css2?family=Italiana&display=swap" rel="stylesheet">

    <!-- Tu CSS personalizado -->
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>

<!-- Banda superior -->
<header class="top-bar">
    <div class="container-fluid d-flex align-items-center justify-content-between">
        <div class="header-title">FIND STOCK MANAGER</div>
    </div>
</header>

<main class="login-wrapper">
    <div class="card custom-card">
        <div class="logo-circle"></div>
        <h2>Bienvenido/a</h2>

        <div class="card-body">
            <span th:if="${param.error}" class="text-danger">Credenciales no válidas</span>

            <form th:action="@{/login}" method="post" sec:authorize="!isAuthenticated()">
                <div class="mb-3">
                    <input type="text" name="username" class="form-control custom-input" placeholder="email"
                           required>
                </div>

                <div class="mb-3">
                    <input type="password" name="password" class="form-control custom-input" placeholder="password"
                           required>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn" id="btn-login">LOGIN</button>
                </div>
            </form>
        </div>

        <div class="card-footer text-center">
            <p sec:authorize="isAuthenticated()">Ya has iniciado una sesión</p>
        </div>
    </div>
</main>

<footer class="footer-bar">
</footer>

<!-- Bootstrap JS (opcional, para componentes dinámicos) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
