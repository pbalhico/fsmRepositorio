# src/main/resources/application.properties
# Propiedades comunes a todos los entornos (pueden ser sobrescritas por perfiles específicos)
# Configuración del servidor web
server.port=8080
# Desactivar la inicialización automática de scripts SQL (schema.sql, data.sql) por defecto
# Esto permite que el DataLoader o scripts de perfil específicos manejen la inicialización
spring.sql.init.mode=never
spring.sql.init.data-locations=
spring.sql.init.schema-locations=
# Activar perfil 'dev' por defecto si no se especifica otro
spring.profiles.active=dev
# Configuración de las tareas programadas (valores por defecto, pueden ser sobrescritas)
# Las tasas de ejecución pueden ser ajustadas por entorno
app.scheduling.generar-pedidos-tienda.fixed-rate=-1
app.scheduling.reponer-stock.fixed-rate=-1
# Configuración de stock mínimo para la reposición (valor por defecto)
app.stock-config.minimo=100