spring.application.name=Find Stock Manager

#server.port=9000
#para que esten conectados los documentos:
spring.messages.basename = mensajes

# consola en navegador web
spring.h2.console.enabled=true

spring.datasource.url=jdbc:h2:mem:fsmdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

#cargar los archivos iniciales
spring.jpa.defer-datasource-initialization=true

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# para que encuentre los sql de inicializacion de datos en otra ubicaci?n
spring.sql.init.data-locations=classpath:data.sql

# Habilita la sobrescritura de beans
spring.main.allow-bean-definition-overriding=true