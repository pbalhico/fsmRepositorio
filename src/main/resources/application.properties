spring.application.name=Find Stock Manager
# Configuración de la base de datos H2 en modo archivo (persistente)
# Los datos se guardarán en un archivo .mv.db en el directorio donde se ejecuta la aplicación.
# ** CAMBIO AQUÍ: Eliminar el parámetro MVCC=FALSE **
# La URL para la aplicación es jdbc:h2:file:./fsmdb
spring.datasource.url=jdbc:h2:file:/db/fsmdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Consola en navegador web (útil para verificar el contenido de la DB)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Permite conexiones remotas (útil en desarrollo, cuidado en prod)
spring.h2.console.settings.web-allow-others=true
# Deshabilita logs de traza detallados
spring.h2.console.settings.trace=false
# Ya no necesitamos habilitar explícitamente el servidor TCP para este modo
# spring.h2.tcp.enabled=false # Puedes añadir esto si quieres ser explícito, pero no es necesario si no usas la URL tcp://
# Configuración de JPA/Hibernate para gestionar el esquema
# 'update' intenta actualizar el esquema existente sin borrar datos
spring.jpa.hibernate.ddl-auto=update
# Configuración para cargar los archivos iniciales (schema.sql y data.sql)
# 'always' asegura que data.sql se ejecute en cada inicio, incluso con ddl-auto=update
spring.sql.init.mode=embedded
spring.sql.init.data-locations=classpath:data.sql
# Si tienes un schema.sql y quieres que se ejecute también en cada inicio con 'always':
spring.sql.init.schema-locations=classpath:schema.sql
# Asegúrate de que schema.sql tiene la longitud correcta (255) para la columna password
# Habilita la sobrescritura de beans (generalmente no necesario a menos que tengas beans duplicados)
spring.main.allow-bean-definition-overriding=true
# Configuración de Logging
logging.level.es.examplepb.findstockmanager.controladores=INFO
logging.level.es.examplepb.findstockmanager.servicios=INFO
# Configuración de JPA/Hibernate para mostrar SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Configuración explícita de Open Session in View para silenciar la advertencia
spring.jpa.open-in-view=true
# Especificar explícitamente el dialecto de H2 (ayuda a Hibernate)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
